<script>
'use strict';
/* ================= CONFIG & DATA (add towers/enemies here) ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=640,H=360,T=16,COLS=40,ROWS=18,BY=288,FONT="'Press Start 2P',monospace";
// Towers: cost, range, fire rate (s), damage, unl = gold to unlock, fx = on-hit effect, trap = placed on path
const TOWERS=[
 {n:'Archer',cost:50,rng:58,rate:.7,dmg:8,col:'#c8a15a',unl:0},
 {n:'Fire',cost:90,rng:54,rate:1,dmg:7,col:'#ff7a2a',unl:60},
 {n:'Ice',cost:80,rng:58,rate:1.1,dmg:4,col:'#6fd3ff',unl:60},
 {n:'Spike',cost:35,rng:0,rate:.5,dmg:9,col:'#9aa0b5',unl:0,trap:1},
 {n:'Ballista',cost:200,rng:120,rate:2,dmg:46,col:'#d94a4a',unl:150}];
// Enemies: hp, speed, radius, colour, gold reward, gate damage, fly = ignores traps. Index 6 = boss
const ENEMIES=[
 {hp:22,sp:30,r:5,c:'#5fa04e',g:4,dm:5},{hp:16,sp:52,r:5,c:'#8a8fa3',g:4,dm:5},
 {hp:70,sp:24,r:6,c:'#3e7d4a',g:8,dm:10},{hp:44,sp:36,r:5,c:'#8a5fd6',g:9,dm:8,fly:1},
 {hp:120,sp:20,r:6,c:'#aab4c8',g:12,dm:15},{hp:260,sp:15,r:8,c:'#a8683a',g:20,dm:25},
 {hp:1800,sp:11,r:12,c:'#b01e2e',g:200,dm:60}];
const WP=[[0,6],[8,6],[8,13],[17,13],[17,7],[27,7],[27,15],[39,15]]; // path waypoints (tiles)
const PTS=WP.map(p=>[p[0]*T+8,p[1]*T+8]);
const pathSet=new Set(),blocked=new Set();
for(let i=0;i<WP.length-1;i++){let [x,y]=WP[i];const [tx,ty]=WP[i+1];for(;;){pathSet.add(x+','+y);if(x==tx&&y==ty)break;x+=Math.sign(tx-x);y+=Math.sign(ty-y)}}

/* ================= PIXEL ART (all sprites are generated at load) ================= */
const PAL={k:'#0d0b14',W:'#ffffff',y:'#ffd24a',o:'#ff7a2a',r:'#b01e2e',R:'#e04040',p:'#5a3a8a',P:'#8a5fd6',e:'#2e6a3a',E:'#5fa04e',n:'#8a93a8',N:'#e0e6f0',g:'#4a4a62',G:'#6a6a88',B:'#7a4e2e',b:'#3a2414',w:'#a8743e',s:'#f2d6a2'};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
// string rows -> canvas ('.' = transparent, letters = PAL colours)
function spr(rows){const w=Math.max(...rows.map(r=>r.length)),c=mk(w,rows.length),x=c.getContext('2d');rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1)}}));return c}
// adds a 1px dark outline around opaque pixels (returns canvas 2px larger)
function outline(c){const w=c.width+2,h=c.height+2,o=mk(w,h),x=o.getContext('2d');x.drawImage(c,1,1);const d=x.getImageData(0,0,w,h),a=d.data,A=(i,j)=>i<0||j<0||i>=w||j>=h?0:a[(j*w+i)*4+3],out=[];
 for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(!A(i,j)&&(A(i-1,j)||A(i+1,j)||A(i,j-1)||A(i,j+1)))out.push((j*w+i)*4);
 for(const k of out){a[k]=13;a[k+1]=11;a[k+2]=20;a[k+3]=255}x.putImageData(d,0,0);return o}
function tint(c,col,al){const o=mk(c.width,c.height),x=o.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-atop';x.globalAlpha=al;x.fillStyle=col;x.fillRect(0,0,c.width,c.height);return o}
// towers: stone keep with crenellations, shading, brick lines + a per-type top
function mkTower(k){const c=mk(20,28),g=c.getContext('2d'),R=(x,y,w,h,f)=>{g.fillStyle=f;g.fillRect(x,y,w,h)},ac=TOWERS[k].col;

  for(const[i,j]of[[3,3],[9,3],[3,9],[9,9]]){q.fillStyle='#6a7488';q.fillRect(i-1,j+2,4,3);q.fillStyle='#c8d0e0';q.fillRect(i,j,2,4);q.fillStyle='#fff';q.fillRect(i,j,1,2)}
  q.fillStyle='#e04040';q.fillRect(1,1,1,1);q.fillRect(14,14,1,1);return outline(t)}
 R(2,24,16,3,'#00000066');R(4,12,12,13,'#4a4a62');R(4,12,3,13,'#6a6a88');R(13,12,3,13,'#33334a');
 for(const y of[15,19,23])R(4,y,12,1,'#2c2c40');R(8,12,1,3,'#2c2c40');R(11,16,1,3,'#2c2c40');R(7,20,1,3,'#2c2c40');
 R(8,19,4,6,'#150e08');R(8,19,4,1,'#4a3220');R(9,18,2,1,'#150e08');
 R(2,8,16,5,'#5a5a78');R(2,8,16,1,'#9a9ab8');R(2,12,16,1,'#2c2c40');
 for(const x of[2,6,10,14]){R(x,5,4,3,'#5a5a78');R(x,5,4,1,'#9a9ab8')}
 R(4,13,12,1,ac);
 if(k==0){R(8,1,4,4,'#f2d6a2');R(7,0,6,2,'#2e6a3a');R(8,3,1,1,'#0d0b14');R(12,0,1,8,'#c8a15a');R(13,1,1,6,'#c8a15a');R(3,0,1,8,'#7a4e2e');R(4,0,4,3,'#b01e2e');R(4,1,4,1,'#e04040')}

['...pppp...','..pPPPPp..','.pPyPPyPp.','.pPPPPPPp.','.pPPkkPPp.','.pPPPPPPp.','.pPPPPPPp.','pPPPPPPPPp','pPpPPPPpPp','p.pPpPPp.p','..p.pp.p..','...p..p...'],

/* ================= PRE-RENDERED MAP (cobbled road, grass, pines, city wall, portal) ================= */
const mapC=mk(W,T*ROWS);
(function(){const m=mapC.getContext('2d');let s=7;const rn=()=>(s=s*16807%2147483647)/2147483647,P=(x,y)=>pathSet.has(x+','+y),R=(x,y,w,h,c)=>{m.fillStyle=c;m.fillRect(x,y,w,h)};
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const px=x*T,py=y*T;
  if(P(x,y)){m.save();m.beginPath();m.rect(px,py,T,T);m.clip();R(px,py,T,T,'#5e4e38');
   for(let j=0;j<2;j++)for(let i=-1;i<2;i++){const cx=px+i*8+(j?4:0),cy=py+j*8,v=rn();R(cx+1,cy+1,6,6,v<.33?'#8a7656':v<.66?'#7a6648':'#957f5c');R(cx+1,cy+1,6,1,'#b4a07a');R(cx+1,cy+6,6,1,'#4a3c2a')}
   if(!P(x,y-1)){R(px,py,T,1,'#0d0b14');R(px,py+1,T,1,'#d8c494')}if(!P(x,y+1)){R(px,py+15,T,1,'#0d0b14');R(px,py+14,T,1,'#d8c494')}if(!P(x-1,y)){R(px,py,1,T,'#0d0b14');R(px+1,py,1,T,'#d8c494')}if(!P(x+1,y)){R(px+15,py,1,T,'#0d0b14');R(px+14,py,1,T,'#d8c494')}
   m.restore();continue}
  R(px,py,T,T,(x+y)%2?'#14202e':'#162434');
  if(x==COLS-1){blocked.add(x+','+y);R(px,py,T,T,'#3a3a52');R(px,py,2,T,'#5a5a78');for(const yy of[0,5,10])R(px,py+yy+4,T,1,'#22223a');R(px+7,py,1,5,'#22223a');R(px+3,py+5,1,5,'#22223a');R(px+10,py+10,1,6,'#22223a');continue}
  for(let k=0;k<5;k++){const rx=px+(rn()*14|0),ry=py+(rn()*12|0);R(rx,ry,1,3,'#244a3a');R(rx+1,ry+1,1,2,'#1c3a30')}
  if(rn()<.08)R(px+(rn()*12|0)+1,py+(rn()*12|0)+1,2,2,rn()<.5?'#8a5fd6':'#b01e2e');
  if(rn()<.05){R(px+4,py+10,5,3,'#3a3a4e');R(px+4,py+10,5,1,'#5a5a72')}
  if(x<COLS-2&&rn()<.07){blocked.add(x+','+y);R(px+3,py+13,10,2,'#0006');R(px+7,py+11,2,4,'#3a2414');for(const[w,yy]of[[12,8],[9,4],[6,0]]){R(px+8-w/2,py+yy,w,5,'#0b2a22');R(px+8-w/2,py+yy,w/2,5,'#145040');R(px+8-w/2,py+yy+4,w,1,'#06180f')}}}
 // spawn portal at path start
 m.save();m.translate(0,(WP[0][1]-3)*T);R(0,38,10,36,'#1a1030');R(0,42,7,28,'#5a3a8a');R(0,46,5,20,'#8a5fd6');R(0,52,3,8,'#e0c8ff');R(8,38,2,36,'#4a4a62');R(0,36,10,3,'#6a6a88');m.restore();
 const g=m.createRadialGradient(W/2,T*ROWS/2,90,W/2,T*ROWS/2,300);g.addColorStop(0,'#00000000');g.addColorStop(1,'#000000aa');m.fillStyle=g;m.fillRect(0,0,W,T*ROWS)})();

/* ================= AUDIO ================= */
let AC=null,soundOn=true;
function sfx(f,d=.08,type='square',v=.04,slide=0){if(!soundOn||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
 o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}

const setLang=l=>{lang=l;try{localStorage.setItem('arrowfall_lang',l)}catch(_){}};

/* ================= STATE ================= */
let S='splash',st=0,G=null,btns=[],mx=-1,my=-1,down=false,last=0;
const setState=s=>{S=s;st=0};
const rnd=()=>Math.random();
const mp=Array.from({length:45},()=>({x:rnd()*W,y:rnd()*H,v:6+rnd()*14,s:1+(rnd()*2|0),c:rnd()<.5?'#ff9a3a':'#8a5fd6'}));
function newGame(){G={gold:150,wave:0,gate:100,maxGate:100,towers:[],en:[],proj:[],par:[],txt:[],strikes:[],rings:[],coins:[],q:[],qt:0,
 phase:'build',spCd:0,sel:null,build:0,aim:false,shake:0,time:0,banner:null,unl:[1,0,0,1,0]};setState('play')}

/* ================= WAVE MANAGER ================= */
function waveList(w){const q=[];
 if(w>10){for(let i=0;i<8;i++)q.push(i%2?5:4);q.push(6);return q}
 const av=[0,w>=2?1:0,w>=3?2:0,w>=5?3:0,w>=6?4:0,w>=8?5:0];
 for(let i=0;i<5+w*2;i++)q.push(av[rnd()*av.length|0]);return q}
function startWave(){if(S!=='play'||G.phase!=='build')return;G.wave++;G.q=waveList(G.wave);G.qt=0;G.phase='fight';G.sel=null;
 G.banner={s:G.wave>10?L('bossW'):L('wave')+' '+G.wave,t:2};sfx(220,.4,'sawtooth',.05,200)}
function spawn(t){const d=ENEMIES[t],hp=t==6?d.hp:d.hp*(1+(G.wave-1)*.12);
 G.en.push({t,hp,mh:hp,x:-8,y:PTS[0][1],i:0,slow:0,burn:0,bt:0,fl:0,prog:0,dead:false})}

/* ================= TOWERS / ACTIONS ================= */
const tdmg=t=>TOWERS[t.k].dmg*(1+.5*(t.lv-1)),trng=t=>TOWERS[t.k].rng+(t.lv-1)*8;
const towerAt=(gx,gy)=>G.towers.find(t=>t.gx==gx&&t.gy==gy);
function canPlace(gx,gy,k){if(gx<0||gy<0||gx>=COLS||gy>=ROWS||blocked.has(gx+','+gy)||towerAt(gx,gy))return false;
 const p=pathSet.has(gx+','+gy);return TOWERS[k].trap?(p&&gx>0&&gx<COLS-2):!p}
function pick(i){if(S!=='play')return;if(!G.unl[i]){const c=TOWERS[i].unl;if(G.gold>=c){G.gold-=c;G.unl[i]=1;G.build=i;sfx(600,.2,'triangle',.06,300)}else sfx(100,.1);return}

function updateGame(dt){G.time+=dt;G.spCd=Math.max(0,G.spCd-dt);G.shake=Math.max(0,G.shake-dt*30);

 // spawning

  const n=PTS[e.i+1],dx=n[0]-e.x,dy=n[1]-e.y,dist=Math.hypot(dx,dy),step=d.sp*(e.slow>0?.5:1)*dt;

  else{e.x+=dx/dist*step;e.y+=dy/dist*step}
  e.prog=e.i*1000-Math.hypot(PTS[Math.min(e.i+1,PTS.length-1)][0]-e.x,PTS[Math.min(e.i+1,PTS.length-1)][1]-e.y)}

   if(hit){t.cd=.5;if(--t.hp<=0){t.dead=true;burst(t.x,t.y,d.col,8)}}continue}
  let best=null,bp=-1e9;const r=trng(t);
  for(const e of G.en)if(!e.dead&&e.prog>bp&&Math.hypot(e.x-t.x,e.y-t.y)<=r){bp=e.prog;best=e}
  if(best){G.proj.push({x:t.x,y:t.y-4,e:best,d:tdmg(t),k:t.k});t.cd=d.rate*Math.pow(.85,t.lv-1);sfx(t.k==4?140:520+rnd()*60,.06,'square',.025,-100)}}

 // special arrow strikes
 for(const s of G.strikes){s.t+=dt;if(s.t>=.25){s.done=true;G.shake=7;burst(s.x,s.y,'#ffd24a',24);G.rings.push({x:s.x,y:s.y,r:4,l:.5,c:'#ffd24a',big:1});sfx(120,.2,'sawtooth',.06,-60);

 for(const t of G.txt){t.l-=dt;t.y-=16*dt}for(const r of G.rings){r.l-=dt;r.r+=(r.big?90:50)*dt}for(const c of G.coins)c.t+=dt*1.6;

  if(G.wave>10){setState('win');sfx(600,.6,'triangle',.07,600);return}

  ctx.fillStyle='#120e1cee';ctx.fillRect(W-170,22,166,40);tx(STR[lang].tn[t.k]+' '+L('lv')+t.lv,W-164,27,'#ffd24a','left',6);

const openInfo=()=>{infoBack=S;setState('info')};

 else if(i==12)gateAt(cx-13.5*k,cy-32*k,k);
 else ctx.drawImage(mapC,0,(WP[0][1]-3)*T+36,12,40,cx-6*k|0,cy-20*k|0,12*k,40*k)}
function langBtns(x,y){['az','en'].forEach((l,i)=>btn(l.toUpperCase(),x+i*44,y,40,20,()=>setLang(l),{on:lang===l}))}
const LN=()=>L('lang')+': '+(lang==='az'?'Azərbaycanca':'English'),togLang=()=>setLang(lang==='az'?'en':'az');
function overlay(title,col,lines,bs){ctx.fillStyle='#000000b8';ctx.fillRect(0,0,W,H);btns.length=0;
 tx(title,W/2,80,col,'center',24);lines.forEach((l,i)=>tx(l,W/2,126+i*14,'#c8c0d8','center',8));bs.forEach((b,i)=>btn(b[0],W/2-90,160+i*34,180,28,b[1]))}

 if(S==='splash'){ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,W,H);

   btn(L('play'),W/2-80,160,160,26,()=>newGame());btn(L('how'),W/2-80,192,160,26,()=>setState('how'));btn(L('info'),W/2-80,224,160,26,openInfo);btn(L('settings'),W/2-80,256,160,26,()=>setState('set'));
   langBtns(W-96,10);tx(L('tag'),W/2,310,'#6a5a88','center',7)}
  if(S==='how'){ctx.fillStyle='#0a0a0fe0';ctx.fillRect(20,20,W-40,H-40);tx(L('how'),W/2,36,'#ff9a3a','center',14);
   STR[lang].hl.forEach((l,i)=>tx(l,44,76+i*20,'#d8d0e8','left',7));btn(L('back'),W/2-80,H-64,160,28,()=>setState('menu'))}
  if(S==='info'){ctx.fillStyle='#0a0a0fe6';ctx.fillRect(12,10,W-24,H-20);tx(L('info'),W/2,18,'#ff9a3a','center',12);
   ORD.forEach((i,j)=>{const x=22+(j%7)*86,y=40+(j/7|0)*46;btn('',x,y,80,42,()=>{infoSel=i},{on:infoSel===i});infoImg(i,x+40,y+21,i<5?1:i<12?2:i==12?.5:1)});
   const i=infoSel,S2=STR[lang],nm=i<5?S2.tn[i]:i<12?S2.mn[i-5]:L(i==12?'gateL':'spawn'),ds=i<5?S2.td[i]:i<12?S2.md[i-5]:L(i==12?'dg':'dp');
   ctx.fillStyle='#120e1c';ctx.fillRect(22,136,W-44,176);ctx.fillStyle='#ffb040';ctx.fillRect(22,136,W-44,1);ctx.fillStyle='#1c1530';ctx.fillRect(30,144,124,160);
   infoImg(i,92,224,i<5?3:i<12?5:i==12?2:3);
   tx(nm,170,148,'#ffd24a','left',12);wrap(ds,430,7).forEach((l,j)=>tx(l,170,172+j*12,'#d8d0e8','left',7));
   const d=TOWERS[i],e=ENEMIES[i-5],st2=i<5?[[L('cost'),d.cost,1],[L('rng'),d.rng||'-'],[L('dmg'),d.dmg],[L('rate'),d.rate+'s']]:i<12?[[L('hp'),e.hp],[L('spd'),e.sp],[L('rew'),e.g,1],[L('gdm'),e.dm]]:i==12?[[L('hp'),100]]:[];
   st2.forEach((r,j)=>{const x=170+(j%2)*210,y=250+(j>>1)*20;tx(r[0]+':',x,y,'#9a8ab8','left',7);if(r[2])coin(x+112,y-1);tx(''+r[1],x+(r[2]?124:112),y,'#ffd24a','left',7)});
   btn(L('back'),W/2-80,322,160,24,()=>setState(infoBack))}
  if(S==='set'){tx(L('settings'),W/2,80,'#ff9a3a','center',20);btn(L(soundOn?'sndOn':'sndOff'),W/2-90,140,180,28,()=>{soundOn=!soundOn;sfx(500,.1)});btn(LN(),W/2-90,176,180,28,togLang);btn(L('back'),W/2-90,226,180,28,()=>setState('menu'))}
  return}
 drawGame();
 if(S==='pause')overlay(L('paused'),'#c8a8ff',[],[[L('resume'),()=>setState('play')],[LN(),togLang],[L('info'),openInfo],[L('menu'),()=>setState('menu')]]);
 if(S==='over')overlay(L('loseT'),'#e03030',[L('loseL').replace('{n}',G.wave)],[[L('retry'),newGame],[LN(),togLang],[L('menu'),()=>setState('menu')]]);
 if(S==='win')overlay(L('winT'),'#ffd24a',[L('winL')],[[L('again'),newGame],[LN(),togLang],[L('menu'),()=>setState('menu')]])}

/* ================= INPUT ================= */
function pos(e){const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',pos);
cv.addEventListener('pointerdown',e=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(_){}
 pos(e);down=true;if(e.button==2){special(mx,my);return}
 for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(mx>=b.x&&mx<b.x+b.w&&my>=b.y&&my<b.y+b.h){sfx(400,.05);b.fn();return}}
 if(S==='play')mapTap(mx,my)});
const up=()=>{down=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(S!=='play'&&S!=='pause')return;
 if(e.key==='Escape'){setState(S==='play'?'pause':'play');return}if(S!=='play')return;
 if(e.code==='Space'){e.preventDefault();special(mx<0?240:mx,my<0?128:my)}
 if(e.key>='1'&&e.key<='5')pick(+e.key-1);if(e.key==='Enter')startWave()});

/* P = save a 1920x1080 PNG screenshot (pixel-perfect 3x upscale of the canvas) */
addEventListener('keydown',e=>{if(e.key!=='p'&&e.key!=='P')return;const o=document.createElement('canvas');o.width=W*3;o.height=H*3;const x=o.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(cv,0,0,W*3,H*3);
 o.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='arrowfall-'+Date.now()+'.png';a.click()})});

/* ================= MAIN LOOP ================= */
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px'}
addEventListener('resize',fit);fit();
if(document.fonts)document.fonts.load("8px 'Press Start 2P'");
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;st+=dt;
 if(S==='splash'&&st>=4.5)setState('menu');
 if(S==='play')updateGame(dt);
 render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
